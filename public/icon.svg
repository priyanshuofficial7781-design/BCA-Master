<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161324" />
      <stop offset="50%" stop-color="#0E0C17" />
      <stop offset="100%" stop-color="#07070B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A970FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#A970FF" stroke-width="4" stroke-opacity="0.25" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="140" fill="#8B5CF6" opacity="0.18" filter="url(#softGlow)" />

  <!-- Hexagonal Tech Shield -->
  <polygon points="256,92 396,172 396,332 256,412 116,332 116,172" fill="#1A162B" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Graduation Cap & Tech Symbol Motif -->
  <!-- Mortarboard Diamond -->
  <polygon points="256,150 360,205 256,260 152,205" fill="url(#accentGrad)" filter="url(#softGlow)" />
  
  <!-- Cap Skull Base -->
  <path d="M192,230 L192,278 C192,305 320,305 320,278 L320,230" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" />

  <!-- Tassel -->
  <path d="M355,208 L368,260 L368,295" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="368" cy="298" r="6" fill="#FDE047" />

  <!-- Code Monogram </BCA> below cap -->
  <text x="256" y="365" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    &lt;BCA/&gt;
  </text>
</svg>
