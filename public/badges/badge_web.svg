<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B2B" />
      <stop offset="50%" stop-color="#0A131F" />
      <stop offset="100%" stop-color="#050B12" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Octagonal Shield Frame -->
  <polygon points="200,20 330,65 375,195 330,325 200,370 70,325 25,195 70,65" fill="url(#webBg)" stroke="url(#neonCyan)" stroke-width="6" />
  <polygon points="200,36 318,76 358,195 318,314 200,354 82,314 42,195 82,76" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4" />

  <!-- Center Glow -->
  <circle cx="200" cy="185" r="90" fill="#06B6D4" opacity="0.2" filter="url(#cyanGlow)" />

  <!-- Code Brackets & Layer Stack Motif -->
  <!-- Upper Bracket < -->
  <path d="M140,140 L95,185 L140,230" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
  <!-- Lower Bracket > -->
  <path d="M260,140 L305,185 L260,230" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
  <!-- Slash / -->
  <path d="M215,130 L185,240" fill="none" stroke="#67E8F9" stroke-width="7" stroke-linecap="round" />

  <!-- Three-tier Fullstack Data Blocks -->
  <g fill="#0284C7" opacity="0.7">
    <rect x="155" y="105" width="90" height="12" rx="4" fill="#38BDF8" />
    <rect x="150" y="248" width="100" height="12" rx="4" fill="#0EA5E9" />
  </g>

  <!-- Title Banner Tab -->
  <rect x="70" y="316" width="260" height="34" rx="8" fill="#081826" stroke="#38BDF8" stroke-width="2" />
  <text x="200" y="338" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    FULL-STACK ARCHITECT
  </text>
</svg>
