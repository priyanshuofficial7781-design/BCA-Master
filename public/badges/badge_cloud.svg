<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24190E" />
      <stop offset="50%" stop-color="#19110A" />
      <stop offset="100%" stop-color="#0E0A05" />
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cyber Aegis Shield Frame -->
  <path d="M200,20 L350,70 L350,210 C350,300 200,375 200,375 C200,375 50,300 50,210 L50,70 Z" fill="url(#cloudBg)" stroke="url(#neonAmber)" stroke-width="6" />
  <path d="M200,36 L335,80 L335,210 C335,286 200,356 200,356 C200,356 65,286 65,210 L65,80 Z" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4" />

  <!-- Center Ambient Glow -->
  <circle cx="200" cy="180" r="85" fill="#F59E0B" opacity="0.22" filter="url(#amberGlow)" />

  <!-- Cloud Infrastructure & Security Lock Motif -->
  <!-- Stylized Cloud Silhouette -->
  <path d="M140,210 C125,210 110,195 110,180 C110,165 125,150 140,150 C145,130 165,115 190,115 C215,115 235,130 240,150 C255,150 270,165 270,180 C270,195 255,210 240,210 Z" fill="#3D2910" stroke="#FDE047" stroke-width="4" filter="url(#amberGlow)" />

  <!-- Cloud Security Keyhole Core -->
  <circle cx="190" cy="165" r="9" fill="#FDE047" />
  <polygon points="186,165 194,165 197,185 183,185" fill="#FDE047" />

  <!-- Server Stack Rows -->
  <rect x="135" y="225" width="110" height="10" rx="3" fill="#D97706" stroke="#FDE047" stroke-width="1" />
  <circle cx="145" cy="230" r="2" fill="#FFFFFF" />
  <circle cx="153" cy="230" r="2" fill="#10B981" />
  <rect x="135" y="242" width="110" height="10" rx="3" fill="#B45309" stroke="#FDE047" stroke-width="1" />
  <circle cx="145" cy="247" r="2" fill="#FFFFFF" />
  <circle cx="153" cy="247" r="2" fill="#10B981" />

  <!-- Title Banner Tab -->
  <rect x="75" y="318" width="250" height="34" rx="8" fill="#241508" stroke="#FDE047" stroke-width="2" />
  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    CLOUD &amp; DEVOPS AEGIS
  </text>
</svg>
